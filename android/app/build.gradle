plugins { id 'com.android.application' }
android {
 namespace 'it.registromedia.app'
 compileSdk 35
 defaultConfig { applicationId 'it.registromedia.app'; minSdk 28; targetSdk 35; versionCode 3; versionName '0.3.0' }
 signingConfigs { debug { if (System.getenv('REGISTROMEDIA_DEBUG_KEYSTORE')) storeFile file(System.getenv('REGISTROMEDIA_DEBUG_KEYSTORE')) } }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
