name: Publish installable apps
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.4.0
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches app version
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Tag does not match package.json')"
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - name: Build Windows installer and portable archive
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Name portable archive
        shell: pwsh
        run: Get-ChildItem dist/*-Setup.zip | Rename-Item -NewName { $_.Name -replace '-Setup.zip$', '-Portable.zip' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: |
            dist/*-Setup.exe
            dist/*-Portable.zip
          if-no-files-found: error
          retention-days: 7
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Android command-line tools
        run: bash scripts/setup-android-ci.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci
      - run: npm run android:assets
      - run: bash scripts/build-android-ci.sh
      - name: Name Android download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/RegistroMedia-${RELEASE_TAG#v}-Android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-download
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-download*'
          path: downloads
          merge-multiple: true
      - name: Check files and calculate checksums
        run: |
          test "$(find downloads -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find downloads -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          test "$(find downloads -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          cd downloads
          sha256sum ./*.exe ./*.zip ./*.apk > SHA256SUMS.txt
      - name: Publish prerelease downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Keep existing downloads and signing identity; use a new version tag for another build.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" downloads/* --verify-tag --draft --prerelease --title "RegistroMedia $RELEASE_TAG · Windows e Android" --notes-file docs/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
